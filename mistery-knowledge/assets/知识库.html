sts": 22, "own_date_range": ["2026-09-26", "2026-11-11"], "summary_count": 22, "full_text_posts": 0, "status_note": "公开索引版：包含原推链接、日期、主题标签和整理者摘要，不分发推文全文或网友回复。覆盖不完整，摘要不是原文引述。", "topic_method": "自动关键词多标签，非作者自设分类；整理摘要仅覆盖标记的部分记录。", "exclusions": ["推文全文", "网友回复正文", "图片、音频与视频", "浏览器会话和分页游标", "旧账号及未获取的历史内容"]}, "topics": ["A股指数与盘中观察", "交易心理与人性", "人生观与关系", "仓位与风险管理", "其他与简短互动", "学习与独立思考", "宏观经济与政策", "市场周期与流动性", "技术分析与交易策略", "港股与恒科", "生活与饮食", "行业板块与个股", "账号声明与社群互动", "资金与机构行为", "黄金与资产配置"]}</script><script>
const db=JSON.parse(document.getElementById('data').textContent),posts=db.posts,byId=new Map(posts.map(p=>[p.id,p]));
const el=id=>document.getElementById(id);let found=[],page=0;const size=30;
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(text,url){const n=node('a',text);n.href=url;n.target='_blank';n.rel='noopener noreferrer';return n}
function textBody(p){const box=node('div');const text=p.text||'（无文字正文，请查看原推媒体）';if(text.length>350){box.append(node('div',text.slice(0,220)+'…','body'));const d=node('details');d.append(node('summary','展开整理内容（'+text.length+' 字符）'),node('div',text,'body'));box.append(d)}else box.append(node('div',text,'body'));return box}
function card(p){const c=node('article',undefined,'card');const meta=node('div',undefined,'meta');meta.append(node('span',p.time_iso.replace('T',' ').slice(0,19)+' 北京时间'),node('span','@'+p.author),node('span',p.text_origin));
for(const t of p.topics)meta.append(node('span',t,'tag'));c.append(meta,textBody(p));
const ids=[['回复对象',p.in_reply_to],['引用推文',p.quoted_id]];
for(const [label,id] of ids){if(!id)continue;const d=node('details',undefined,'context');d.append(node('summary',label+' · '+id));const other=byId.get(id);if(other){d.append(node('div',other.date+' @'+other.author,'muted'),node('div',other.text||'（无文字正文）','body'),link('查看该原推',other.url))}else d.append(node('p','该条上下文尚未收录。'),link('在 X 查看','https://x.com/i/web/status/'+id));c.append(d)}
if(p.media?.length){const d=node('details',undefined,'context');d.append(node('summary','媒体 '+p.media.length+' 项 · 未转写'));p.media.forEach((m,i)=>d.append(link('媒体 '+(i+1)+'（'+m.type+'）',m.url),node('br')));c.append(d)}
const f=node('footer');f.append(link('查看原推 ↗',p.url),node('span',p.id,'muted'));c.append(f);return c}
function render(){el('results').replaceChildren(...found.slice(page*size,(page+1)*size).map(card));el('count').textContent='找到 '+found.length+' 条记录';el('empty').classList.toggle('hidden',found.length>0);el('page').textContent=(found.length?page+1:0)+' / '+Math.ceil(found.length/size);el('prev').disabled=page===0;el('next').disabled=(page+1)*size>=found.length}
function search(){const terms=el('query').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean),any=el('any').checked;const start=el('since').value,end=el('until').value;
if(start&&end&&start>end){found=[];page=0;render();el('count').textContent='起始日期不能晚于截止日期';return}
found=posts.filter(p=>{if(!el('context').checked&&!(terms.length===1&&/^[0-9]{15,20}$/.test(terms[0]))&&p.author!=='wr0789')return false;if(start&&p.date<start)return false;if(end&&p.date>end)return false;if(el('topic').value&&!p.topics.includes(el('topic').value))return false;const hay=(p.text+' '+p.id).toLocaleLowerCase();return !terms.length||(any?terms.some(t=>hay.includes(t)):terms.every(t=>hay.includes(t)))});
const order=el('order').value;const score=p=>terms.reduce((n,t)=>n+Math.min(p.text.toLocaleLowerCase().split(t).length-1,5),0);
found.sort((a,b)=>order==='oldest'?a.time_iso.localeCompare(b.time_iso):order==='newest'?b.time_iso.localeCompare(a.time_iso):(score(b)-score(a))||((b.text.length>=300)-(a.text.length>=300))||b.time_iso.localeCompare(a.time_iso));page=0;render()}
for(const t of db.topics){const o=node('option',t);o.value=t;el('topic').append(o)}
for(const q of ['恒科 定投','三浪 主升','空仓','人性','烤牛肉','不收费']){const b=node('button',q);b.onclick=()=>{el('query').value=q;el('topic').value='';search()};el('quick').append(b)}
el('search').onclick=search;el('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
for(const id of ['topic','since','until','order','any','context'])el(id).addEventListener('change',search);
el('reset').onclick=()=>{for(const id of ['query','topic','since','until'])el(id).value='';el('order').value='relevance';el('any').checked=el('context').checked=false;search()};
el('prev').onclick=()=>{page--;render()};el('next').onclick=()=>{page++;render()};
for(const [value,label] of [[db.coverage.own_posts,'原推链接'],[db.coverage.context_posts,'分发原文'],[db.coverage.own_long_posts,'整理摘要'],[db.coverage.own_date_range.join(' — '),'来源日期范围']]){const d=node('div',undefined,'stat');d.append(node('strong',String(value)),node('span',label));el('stats').append(d)}
el('notice').textContent=db.coverage.status_note;el('coverage').textContent=JSON.stringify(db.coverage,null,2);search();
</script></body></html>
